<!-- @dsCard group="Data" height=200 subtitle="What's coming, and is it covered" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui)}
.wrap{margin:var(--space-6);overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:6px;font-family:var(--font-data);font-size:12px;line-height:17px}
.m{min-height:92px;padding:10px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.m b{font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--text-muted)}
.now{background:var(--accent-soft);border-color:transparent}
.short{background:var(--attention-soft);border-color:transparent}
.ok{align-self:flex-start;padding:1px 6px;border-radius:var(--radius-sm);background:var(--accent-soft)}
.no{align-self:flex-start;padding:1px 6px;border-radius:var(--radius-sm);background:var(--surface)}
</style></head><body>
<div class="wrap"><div class="grid">
<div class="m now"><b>NOV</b>Now</div>
<div class="m"><b>DEC</b>Christmas 9,800<span class="ok">Funded</span></div>
<div class="m"><b>JAN</b>Kommunale avgifter 4,350<span class="ok">Funded</span></div>
<div class="m"><b>FEB</b></div>
<div class="m"><b>MAR</b>EU-kontroll 2,600<span class="ok">Funded</span></div>
<div class="m short"><b>MAY</b>Konfirmasjon 38,000<span class="no">Short 26,400</span></div>
</div></div>
</body></html>
