<!-- @dsCard group="Assistant" height=250 subtitle="How every suggestion looks" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:22px}
.card{margin:var(--space-6);max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.who{align-self:flex-start;font-size:12px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full);background:var(--surface-raised);color:var(--text-muted)}
p{margin:0}
.ev{font-family:var(--font-data);font-size:11px;letter-spacing:.06em;color:var(--text-muted)}
.acts{display:flex;flex-wrap:wrap;gap:var(--space-2)}
button{font:inherit;font-weight:500;min-height:var(--target-min);padding:0 16px;border-radius:var(--radius-md);cursor:pointer}
.a{background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
.c{background:transparent;color:var(--text);border:1px solid var(--line)}
.d{background:transparent;color:var(--text-muted);border:0}
</style></head><body>
<div class="card">
<span class="who">Suggested by the assistant</span>
<p>Audible started charging 169 kr a month on 14 October, after a free trial. Cancelling it would save 2,028 kr a year.</p>
<span class="ev">FROM 2 CHARGES · FELLES BRUKSKONTO · OCT–NOV</span>
<div class="acts"><button class="a" type="button">I'll cancel it</button><button class="c" type="button">Keep</button><button class="d" type="button">Dismiss</button></div>
</div>
</body></html>
