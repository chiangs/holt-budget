<!-- @dsCard group="Actions" height=150 subtitle="Primary, secondary, quiet and destructive" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-6);align-items:center}
button{font:inherit;font-size:15px;font-weight:500;min-height:var(--target-min);padding:0 18px;border-radius:var(--radius-md);cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.quiet{background:transparent;color:var(--accent);border:0}
.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.focus{outline:2px solid var(--focus);outline-offset:2px}
</style></head><body>
<div class="row">
<button class="primary" type="button">Add job</button>
<button class="secondary" type="button">Cancel</button>
<button class="quiet" type="button">Undo</button>
<button class="danger" type="button">Undo this import</button>
<button class="primary focus" type="button">Focused</button>
</div>
</body></html>
