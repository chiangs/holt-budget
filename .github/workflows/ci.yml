name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npx -y pnpm@12.18.0 install --frozen-lockfile
      - run: npx -y pnpm@12.18.0 tokens
      - run: git diff --exit-code packages/ui/src/tokens.css
      - run: npx -y pnpm@12.18.0 typecheck
      - run: npx -y pnpm@12.18.0 test
      - run: npx -y pnpm@12.18.0 --filter @holt/desktop build
